.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}h2{margin:0 0 10px;font-size:17px}h3{margin:12px 0 6px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:24px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}th{color:var(--mut);white-space:nowrap}

.pin{border-left:4px solid var(--warn)}.flash{background:var(--card);border:1px solid var(--ok);border-radius:8px;padding:8px 12px;margin-bottom:12px}

#pfw{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px;z-index:50}

.box{border:1px solid #666;padding:10px;margin-top:10px;min-height:90px}
@media print{body>*:not(#pfw){display:none!important}#pfw{display:block!important;position:static;background:none;padding:0}.noprint{display:none!important}}

async function sectionGroup(i,mode){const g=groups()[i];if(!g)return;const st=[...g.st],size=Math.max(5,+blkSize||40),items=[];
 if(mode=='shuffle'){if(g.year>2)return alert('3rd and 4th year blocks are not shuffled.');if(!confirm('Re-section '+st.length+' students at random? Their current blocks will be replaced.'))return;
  for(let a=st.length-1;a>0;a--){const j=Math.floor(Math.random()*(a+1));[st[a],st[j]]=[st[j],st[a]]}
  const k=Math.ceil(st.length/size),base=Math.floor(st.length/k),extra=st.length%k;let p=0;for(let b=0;b<k;b++){const n=base+(b<extra?1:0);for(let c=0;c<n;c++)items.push({id:st[p++].id,block:LET(b)})}
 }else{const cnt={};st.filter(s=>s.block).forEach(s=>cnt[s.block]=(cnt[s.block]||0)+1);
  st.filter(s=>!s.block).sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{let b=Object.keys(cnt).filter(x=>cnt[x]<size).sort((x,y)=>cnt[x]-cnt[y])[0];if(!b){b=LET(Object.keys(cnt).length);cnt[b]=0}cnt[b]++;items.push({id:s.id,block:b})})}

V.student_Grades=()=>{const s=me_s()||{id:''},g=S.gr[s.id]||{},tc=new Set(termSubs(s).map(x=>x.code)),cs=Object.keys(g).filter(c=>g[c]&&tc.has(c)),a=gwOf(s,cs);return`<div class="card"><h2>My grades — ${esc(S.term)}</h2><table><tr><th>Subject</th><th>Grade</th></tr>${cs.map(c=>`<tr><td>${esc(c)} ${esc((sub(c)||{}).title)}</td><td>${esc(g[c])}</td></tr>`).join('')||'<tr><td class="mut">No grades posted for your current subjects yet.</td></tr>'}</table>${a!=null?`<p><b>Term GWA: ${a.toFixed(3)}</b></p>`:''}</div>`};
V.student_Enroll=()=>{const s=me_s();if(!s)return'';const r=S.req[s.id];if(!r&&!pick.length&&s.status=='regular')pick=defLoad(s);
 return`<div class="card"><h2>Enrollment — ${esc(S.term)}</h2>${r?`<p>Request status: <b>${r.status}</b> · Finance: ${s.cleared?'<b class="ok">Cleared</b>':'<b class="warn">Not cleared</b>'}</p><p class="mut">Ask the Registrar to print your enrollment form.</p><hr>`:''}
 <div class="flash"><b>Reminder:</b> pay your fees at the Finance Office. The Registrar will mark you “Finance cleared” once paid.</div>
 <p class="mut">Pick subjects. Subjects with unmet prerequisites are locked.</p>${enrFilter(s)}${enrList(s).map(x=>{const u=unmet(s.id,x);return`<label style="display:block;margin:4px 0;${u.length?'opacity:.55':''}"><input type="checkbox" ${u.length?'disabled':''} ${pick.includes(x.code)?'checked':''} onchange="pick=pick.filter(c=>c!='${x.code}');if(this.checked)pick.push('${x.code}')"> <b>${esc(x.code)}</b> ${esc(x.title)} (${x.units}u) <span class="mut">${esc(x.days)} ${esc(x.time)}</span>${u.length?` <span class="warn">needs ${u.join(', ')}</span>`:''}</label>`}).join('')}
 <p><button class="btn p" onclick="reqEnr('${s.id}')">Submit request</button></p></div>`};
async function reqEnr(id){if(!pick.length)return;const r=await sb.from('requests').upsert({student_id:id,subjects:pick,status:'pending'});if(r.error)return alert(r.error.message);flash='Request sent. Please settle your balance at the Finance Office.';await load();render()}
/* PRINT */
function printForm(id){if(me.role!='registrar')return alert('Only the registrar can print enrollment forms.');const s=stu(id),rows=termSubs(s);
 $('#pfw').style.display='block';$('#pfw').innerHTML=`<div class="noprint" style="max-width:760px;margin:0 auto 10px"><button class="btn p" onclick="window.print()">Print</button> <button class="btn" onclick="$('#pfw').style.display='none'">Close</button></div>
 <div class="pf"><h2 style="text-align:center;margin:0">${esc(S.school)}</h2><p style="text-align:center;margin:0 0 12px">ENROLLMENT FORM · ${esc(S.term)}</p>
 <p><b>Name:</b> ${esc(s.name)} &nbsp; <b>ID:</b> ${esc(s.id)} &nbsp; <b>Course/Year:</b> ${esc(s.course)} / ${s.year} &nbsp; <b>Status:</b> ${s.status} &nbsp; <b>Block:</b> ${esc(s.block||'—')}</p>
 <table style="width:100%;border-collapse:collapse"><tr><th>Code</th><th>Subject</th><th>Units</th><th>Schedule</th><th>Room</th></tr>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.title)}</td><td>${x.units}</td><td>${esc((x.sessions&&x.sessions.length)?sessTxt(x.sessions):((x.days||'')+' '+(x.time||'')))}</td><td>${esc(x.room)}</td></tr>`).join('')}<tr><td colspan="2" align="right"><b>Total units</b></td><td colspan="3"><b>${rows.reduce((a,x)=>a+(+x.units||0),0)}</b></td></tr></table>
 <div class="box"><b>FOR FINANCE OFFICE</b><br>Total assessed: ${peso(s.tuition)} &nbsp; Amount paid: ______________ &nbsp; Balance: ${peso(bal(s))}<br><br>Received by: ____________________ &nbsp; Date: __________</div>
 <div class="box"><b>FOR REGISTRAR</b> (stamp here)<br><br>☐ ENROLLED &nbsp;&nbsp; ☐ NOT ENROLLED<br><br>Signature: ____________________ &nbsp; Date: __________</div></div>`}
render();start();
</script></body></html>
